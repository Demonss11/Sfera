[package]
name = "sfera"
version = "0.2.0"
edition = "2021"
description = "Компилятор языка программирования «Сфера» (файлы .код)"

[[bin]]
name = "запустить"
path = "src/main.rs"

[dependencies]
# LLVM-бэкенд для генерации машинного кода.
# ВАЖНО: помимо этой Rust-зависимости, на компьютере должен быть физически
# установлен сам LLVM версии 18 (это внешний, системный компилятор,
# а не то, что подтягивается через cargo). См. README ниже про установку.
#
# ⚠️ НАЙДЕНО РЕАЛЬНОЙ ПРОВЕРКОЙ (сборка на Windows): inkwell по умолчанию
# включает фичу "target-all", из-за которой генерируются методы
# Target::initialize_arm/bpf/mips/... для ВСЕХ таргетов LLVM. Готовый пакет
# LLVM для Windows (vovkos/llvm-package-windows) собран ТОЛЬКО с X86 — при
# линковке это вываливается десятками "unresolved external symbol:
# LLVMInitializeARMTarget" и т.п., хотя ни один из этих таргетов не нужен.
# Поэтому default-features отключены, а таргеты включаются явно и раздельно
# по платформе: на Windows доступен только X86, на остальных (macOS/Linux,
# включая кросс-сборку под Android) дополнительно aarch64 — см. таблицы
# ниже в этом файле.
#
# Для языкового сервера (src/bin/сфера_lsp.rs) — НЕ нужны компилятору
# самому по себе (main.rs их не использует), но раз уж они в общем списке
# зависимостей пакета, cargo build соберёт лишнее и для обычного
# компилятора тоже — небольшая, но осознанная цена за простоту, вместо
# выделения языкового сервера в отдельный под-пакет (workspace).
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1.0"
serde_json = "1.0"

# НОВОЕ: НАЙДЕНО РЕАЛЬНОЙ ПРОВЕРКОЙ — при кросс-компиляции самого
# компилятора под Android линковка падала с десятками "undefined
# symbol: LLVMInitializeXXXTargetInfo" (для AMDGPU, ARM, X86 и т.д.) —
# причина не в нашем коде (см. codegen.rs, обе ветки уже переключены на
# initialize_aarch64), а в том, что llvm-sys САМ, при своей сборке,
# безусловно компилирует вспомогательный C-файл ("wrappers/target.c"),
# который ссылается на ВСЕ таргеты LLVM разом — линковщик требует
# разрешить все эти символы, даже если наш код их не вызывает вообще.
# Наша Android-сборка LLVM специально ограничена только AArch64
# (экономия времени сборки) — эти функции для остальных таргетов
# просто не существуют. "disable-alltargets-init" (родная фича
# llvm-sys) полностью отключает компиляцию этого файла.
#
# ⚠️ Именно поэтому эта зависимость — ТОЛЬКО для target_os = "android":
# для обычной, host-сборки (macOS/Linux, где LLVM собрана со всеми
# таргетами) обе ветки codegen.rs по-прежнему используют initialize_all/
# initialize_native — им этот файл всё ещё нужен, отключать его для
# всех платформ сразу сломало бы обычную сборку.
[target.'cfg(target_os = "android")'.dependencies]
llvm-sys = { version = "180.0.0", features = ["disable-alltargets-init"] }

# inkwell — по платформе, см. подробный комментарий у [dependencies].
# На Windows нет метода initialize_aarch64 (пакет LLVM без aarch64), и
# codegen.rs в Windows-сборке его не вызывает — см. cfg-ветки там же.
[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.5", default-features = false, features = ["llvm18-0", "target-x86"] }

[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "0.5", default-features = false, features = ["llvm18-0", "target-x86", "target-aarch64"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
